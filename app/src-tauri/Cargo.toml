[package]
name = "chess-academie"
version = "1.1.0"
description = "Chess Académie : un professeur d'échecs virtuel"
authors = ["Mahouna"]
edition = "2021"

[lib]
name = "chess_academie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chess-engine = { path = "../.." }

[profile.release]
lto = true
codegen-units = 1
